<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0b0d17;--pn:#151827;--ln:#262b45;--tx:#eef0ff;--mu:#8b92bd;--ac:#ffb020;--ok:#3ddc97;--bad:#ff5c72}
body.dn{--bg:#07050b;--pn:#120c1c;--ln:#3a1f4d;--ac:#ff2d75;--mu:#a48bbd}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:40px;transition:background .3s}
body.dn{font-family:ui-monospace,Menlo,Consolas,monospace;background:radial-gradient(800px 400px at 50% -10%,#3b0a2e,transparent),var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
h1{font-size:clamp(1.5rem,5vw,2.3rem);margin:22px 0 4px}
.sub{color:var(--mu);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.ph{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(135deg,#232a52,#141833);overflow:hidden}
body.dn .ph{background:linear-gradient(135deg,#2b0f3d,#0d0714)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.cb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb b{font-size:.92rem;line-height:1.25}
.cb small{color:var(--mu)}
.pr{color:var(--ac);font-weight:800;margin-top:auto;word-break:break-word}
.qty{display:flex;align-items:center;justify-content:space-between;background:#0d1020;border-radius:12px;padding:3px}
.qty button{width:38px;height:34px;border:0;border-radius:10px;background:var(--ac);color:#111;font-weight:800;font-size:1.1rem}
.qty button:disabled{background:#2a2f4d;color:#666;cursor:not-allowed}
.char{cursor:pointer;text-align:center}
.char .ph{aspect-ratio:1;font-size:3.4rem}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.pill{border:1px solid var(--ln);background:var(--pn);border-radius:99px;padding:7px 13px;font-size:.88rem}
.pill.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
select.pill{padding-right:8px}
.who{font-weight:700}
.bal small{color:var(--mu)}
#bal{font-size:clamp(1.6rem,7.5vw,3rem);font-weight:900;line-height:1.1;color:var(--ok);word-break:break-all;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;font-size:.85rem}
.stats>div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px}
.bar{height:6px;background:#232848;border-radius:9px;margin:5px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .5s}
.debt{color:var(--bad);font-weight:800}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
nav .pill{white-space:nowrap}
#tools{display:flex;flex-direction:column;gap:8px;margin:12px 0}
#q{width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;outline:0}
#q:focus{border-color:var(--ac)}
#chips{display:flex;gap:6px;overflow-x:auto}
.ord{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ord .e{font-size:2rem}
.ord small{color:var(--mu);display:block}
.ord .stx{color:var(--ok);font-weight:700}
iframe{width:100%;height:230px;border:1px solid var(--ln);border-radius:14px;margin-bottom:14px;filter:invert(.9) hue-rotate(180deg)}
h3{margin:14px 0 8px}
.tag{color:var(--ok);font-size:.8rem;font-weight:700}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ac);border-radius:18px;padding:20px;max-width:340px;width:90%}
dialog::backdrop{background:#000a}
dialog .pill{display:block;width:100%;margin-top:8px;text-align:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:#fff;color:#111;padding:12px 18px;border-radius:14px;font-weight:600;max-width:92%;transition:transform .3s;z-index:20;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:var(--bad);color:#fff}
.foot{color:var(--mu);font-size:.78rem;text-align:center;margin-top:24px}

body{padding-bottom:88px}
body.dn{--ac:#00ff9c;--ln:#0f4d36;--pn:#07140f;--bg:#020806;--mu:#6fbf9a;background:#020806}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:space-around;gap:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 2px max(6px,env(safe-area-inset-bottom))}
nav[hidden]{display:none}
nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.62rem;position:relative;padding:4px 6px;flex:1;min-width:0}
nav button i{font-style:normal;font-size:1.4rem}
nav button.on{color:var(--ac)}
nav b{position:absolute;top:-1px;right:6px;background:var(--bad);color:#fff;border-radius:9px;padding:0 5px;font-size:.62rem}
.tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--ln);transition:transform .15s}
.tile:hover{transform:scale(1.02);border-color:var(--ac)}
.tile .ph{position:absolute;inset:0;aspect-ratio:auto;font-size:4rem}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,#000d);font-weight:800;font-size:1.1rem}
.go{width:100%;margin-top:12px;border:0;background:var(--ac);color:#111;font-weight:800;padding:14px;border-radius:14px;font-size:1.05rem}
#map{height:52vh;min-height:300px;border-radius:16px;border:1px solid var(--ln);margin-bottom:12px}
.leaflet-tile-pane{filter:invert(.92) hue-rotate(180deg) brightness(.9)}
.trk{font-size:24px;filter:drop-shadow(0 0 4px #000)}
.cardv{border-radius:18px;padding:16px;margin-bottom:12px;color:#fff;aspect-ratio:1.6;max-width:340px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px #0006}
.cardv b{font-size:1.2rem;font-style:italic}
.cardv .num{font-size:1.15rem;letter-spacing:.12em;font-family:ui-monospace,monospace}
canvas#rain{position:fixed;inset:0;z-index:-1;opacity:.4;display:none;pointer-events:none}
body.dn canvas#rain{display:block}
.boot{color:var(--ac);font-size:.85rem;margin-bottom:8px}
.boot span{display:block;opacity:0;animation:fi .4s forwards}
@keyframes fi{to{opacity:1}}
.warn{border:1px solid var(--ac);color:var(--ac);padding:10px 12px;border-radius:10px;margin:8px 0 14px;font-size:.9rem}
.glitch{animation:gl 3s infinite}
@keyframes gl{0%,90%,100%{transform:none;text-shadow:none}92%{transform:translate(2px,0);text-shadow:-2px 0 #f0f,2px 0 #0ff}96%{transform:translate(-2px,1px);text-shadow:2px 0 #f0f,-2px 0 #0ff}}
.conf i{position:fixed;top:-30px;font-style:normal;font-size:1.6rem;animation:fall 2.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{bottom:92px}
</style>

  } else if (tab==="ord") {
    h = S.orders.length ? S.orders.map((o,i) => {
      const it=ALL[o.id], dur=o.dur||30000, age=Date.now()-o.t, f=Math.min(1,age/dur), k=f>=1?3:f<.05?0:f<.6?1:2;
      return `<div class="ord"><div class="e">${it.e}</div><div style="flex:1"><b>${esc(it.n[LI()])}${o.q>1?" ×"+o.q:""}</b><small>📍 ${esc(o.c)}${o.on?" ← "+esc(o.on):""}${o.s?" · "+esc(o.s):""}</small><span class="stx">${t("st")[k]}</span><div class="bar"><i style="width:${f*100}%"></i></div>${f<1?`<small>${eta(dur-age)}</small><button class="pill" data-a="speed" data-i="${i}">${t("speed")}</button>`:""}</div></div>`;
    }).join("") : `<p class="sub">${t("empty")}</p>`;
  } else if (tab==="map") {
    const sh = (SHOPS[S.city]||["Local Market"]).slice(0,2), pool = ITEMS.filter(i=>!i.dn&&i.p<=2e6);
    h = `<div class="row" style="margin-bottom:8px"><input id="cs" class="pill" style="flex:1;min-width:0" placeholder="${t("csearch")}"><button class="pill on" data-a="csearch">🔎</button><button class="pill" data-a="gps">${t("gps")}</button></div><div id="map"></div><h3>${t("nearT")}: ${esc(cityName())}</h3>` +
      sh.map(s => { const hh=hash(s+S.city); return `<h3>🏪 ${esc(s)} · ${(.4+hh%40/10).toFixed(1)} ${t("away")}</h3><div class="grid">${[0,1,2].map(j=>card(pool[(hh+j*7)%pool.length],.85,s)).join("")}</div>`; }).join("");
  } else {
    const own = ITEMS.filter(i=>S.inv[i.id]), tot = own.reduce((a,i)=>a+i.p*S.inv[i.id],0);
    h = `<h3>${t("cardT")}</h3><div class="row" style="margin-bottom:8px"><select class="pill" data-a="country">${COUNTRIES.map(([c,n])=>`<option value="${c}" ${c===S.country?"selected":""}>${n}</option>`).join("")}</select></div>${cards().map(cardHtml).join("")}<small>${t("demo")}</small><h3>${t("mine")}${own.length?" · "+fmt(tot):""}</h3>` + (own.length ? `<div class="grid">${own.map(i=>card(i,1,"",1)).join("")}</div>` : `<p class="sub">${t("empty")}</p>`);
  }
  m.innerHTML = h; lastTab = tab;
  if (tab==="map") initMap();
  loadImgs();
}
const render = () => { renderTop(); renderMain(); };

function after() {
  const k = tier(); if (k > S.tier) { S.tier = k; toast("🏆 "+Math.round(pct())+"% — "+t("a")[k]); }
  save(); render();
}
function cadd(id, d, s) { const k=kf(id,d,s); (S.cart[k]=S.cart[k]||{id,d,s,q:0}).q++; save(); renderNav(); renderMain(); }
function cdec(k) { const l=S.cart[k]; if (!l) return; if (--l.q<=0) delete S.cart[k]; save(); renderNav(); renderMain(); }
function checkout() {
  const tot = cartTotal(); if (!tot) return;
  if (S.cash < tot) return toast(t("warn"), 1);
  const dest = coords(), dn = cityName(); let n = 0;
  Object.values(S.cart).forEach(l => {
    const it = ALL[l.id]; S.inv[l.id] = (S.inv[l.id]||0)+l.q; n += l.q;
    let o, on = "";
    if (l.s || it.c==="food") { o = [dest[0]+.04, dest[1]+.04]; on = l.s; }
    else if (UZC.includes(l.id)) { o = [40.64,72.24]; on = "Asaka"; }
    else { const g = ORG[hash(l.id)%ORG.length]; o = [g[1],g[2]]; on = g[0]; }
    S.orders.unshift({id:l.id, q:l.q, t:Date.now(), dur:Math.min(6048e5,(1800+km(o,dest)*60)*1000), o, d:dest, c:dn, s:l.s, on, price:it.p*l.d*l.q});
  });
  const a = tot/(S.start+S.loaned)*100;
  S.cash -= tot; S.spent += tot; S.cart = {}; S.orders = S.orders.slice(0,40);
  const dl = $("#dlg");
  dl.innerHTML = `<div class="conf">${Array.from({length:18},(_,i)=>`<i style="left:${i*5.6}%;animation-delay:${(i%6)*.25}s">💸</i>`).join("")}</div><h3>✅ ${t("done")}</h3><p>${n} ${t("items")} · ${fmt(tot)}</p><p style="margin-top:8px">${t("spMsg").replace("{a}",a.toFixed(3)).replace("{p}",pct().toFixed(2)).replace("{l}",(100-pct()).toFixed(2))}</p><button class="pill on" data-a="okd">OK</button><button class="pill" data-a="again">${t("again")}</button>`;
  dl.showModal(); after();
}
function speed(i) {
  const o = S.orders[i]; if (!o) return; const c = Math.max(1, o.price*.02);
  if (S.cash < c) return toast(t("warn"), 1);
  S.cash -= c; o.dur = Math.min(o.dur, Date.now()-o.t+20000); toast("⚡ −"+fmt(c)); after();
}
function sell(id) {
  if (!S.inv[id]) return; const g = ALL[id].p*.75;
  S.cash += g; S.spent -= g; if (--S.inv[id] <= 0) delete S.inv[id];
  toast("💰 "+t("sold")+": "+fmt(g)); after();
}
function loan(a) {
  if (S.debt + a*1.2 > 1.2e6 + .01) return toast(t("limit"), 1);
  S.cash += a; S.loaned += a; S.debt += a*1.2; $("#dlg").close(); toast(t("ok")); after();
}
function repay() {
  const x = Math.min(S.cash, S.debt); if (x < .01) return toast(t("noDebt"), 1);
  S.cash -= x; S.debt = S.debt-x < .01 ? 0 : S.debt-x; toast(t("paid")); after();
}
function setLoc(la, lo, name) { S.loc=[la,lo]; S.locName=name; S.city="📍"; save(); render(); }
function gps() {
  if (!navigator.geolocation) return toast("GPS yo'q", 1);
  navigator.geolocation.getCurrentPosition(p => setLoc(p.coords.latitude, p.coords.longitude, "GPS"), () => toast("GPS ruxsati berilmadi", 1), {timeout:8000});
}
function csearch() {
  const v = ($("#cs").value||"").trim(); if (!v) return;
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(v)).then(r=>r.json()).then(j => {
    if (!j.length) return toast("?", 1); setLoc(+j[0].lat, +j[0].lon, j[0].display_name.split(",")[0]);
  }).catch(() => toast("Xarita qidiruvi ishlamadi", 1));
}
function start(id) {
  const c = CH.find(x=>x[0]===id);
  Object.assign(S, {ch:id, cash:c[3], start:c[3], loaned:0, debt:0, spent:0, inv:{}, cart:{}, orders:[], tier:-1, tab:"shop", cat:"all"});
  shown = S.cash; show(); save();
}
function show() {
  const g = !!S.ch; $("#pick").hidden = g; $("#game").hidden = !g; $("#nav").hidden = !g;
  g ? render() : renderPick();
  if (g && !S.asked) { S.asked = 1; save(); gps(); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName==="SELECT") return;
  const a = b.dataset.a, id = b.dataset.id, ds = b.dataset;
  if (a==="start") start(id);
  else if (a==="back") { S.ch=""; save(); show(); }
  else if (a==="cur") { S.cur=id; save(); shown=S.cash; render(); }
  else if (a==="tab") { S.tab=id; save(); render(); scrollTo(0,0); }
  else if (a==="cat") { S.cat=id; save(); renderMain(); scrollTo(0,0); }
  else if (a==="cadd") cadd(id, +ds.d, ds.s);
  else if (a==="cdec") cdec(ds.k);
  else if (a==="sell") sell(id);
  else if (a==="repay") repay();
  else if (a==="loan") loan(+id);
  else if (a==="checkout") checkout();
  else if (a==="speed") speed(+ds.i);
  else if (a==="csearch") csearch();
  else if (a==="gps") gps();
  else if (a==="okd") $("#dlg").close();
  else if (a==="again") { $("#dlg").close(); start(S.ch); }
  else if (a==="loanDlg") { const d=$("#dlg"); d.innerHTML=`<p style="margin-bottom:6px">${t("about")}</p>`+[1e4,1e5,1e6].map(v=>`<button class="pill" data-a="loan" data-id="${v}">+ ${fmt(v)} → ${t("debt")} ${fmt(v*1.2)}</button>`).join("")+`<button class="pill" onclick="this.closest('dialog').close()">✕</button>`; d.showModal(); }
});
document.addEventListener("change", e => {
  const a = e.target.dataset.a;
  if (a==="lang") { S.lang=e.target.value; document.documentElement.lang=S.lang; save(); show(); }
  else if (a==="city") { S.city=e.target.value; save(); render(); }
  else if (a==="country") { S.country=e.target.value; save(); renderMain(); }
});
document.addEventListener("keydown", e => { if (e.target.id==="cs" && e.key==="Enter") csearch(); });
$("#q").addEventListener("input", renderMain);
setInterval(() => {
  if (!S.ch) return;
  if (S.tab==="ord") renderMain();
  else if (S.tab==="map" && MAP) TR.forEach(([o,m]) => m.setLatLng(pos(o)));
}, 2500);

// Matrix yomg'iri (faqat Darknet'da ko'rinadi)
(function () {
  const c = $("#rain"), x = c.getContext("2d"); let w, h, ys = [];
  const rs = () => { w = c.width = innerWidth; h = c.height = innerHeight; ys = Array(Math.floor(w/16)).fill(0); };
  rs(); addEventListener("resize", rs);
  setInterval(() => {
    if (!document.body.classList.contains("dn")) return;
    x.fillStyle = "rgba(2,8,6,.12)"; x.fillRect(0,0,w,h); x.fillStyle = "#00ff9c"; x.font = "14px monospace";
    ys.forEach((y,i) => { x.fillText("01ABCDEF<>{}$#"[Math.random()*14|0], i*16, y); ys[i] = y>h && Math.random()>.975 ? 0 : y+16; });
  }, 60);
})();

document.documentElement.lang = S.lang;
S.cart = S.cart || {}; S.country = S.country || ({uz:"UZ",ru:"RU",en:"US"})[S.lang];
if (S.tab==="mine" || S.tab==="near") S.tab = "shop";
if (S.ch && typeof S.cash!=="number") S.ch = "";
shown = S.cash || 0; show();
</script>
</body>
